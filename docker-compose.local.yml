# docker-compose.local.yml
# Local development overrides for YMarketplace
# Adds: PostgreSQL database, environment files, bind mounts for live reload
# Note: MinIO is deployed separately via deploy-common-apps.sh (shared infrastructure)

services:
  ymarketplace-db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yuvro_marketplace_db
    volumes:
      - ymarketplace_postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - ymarketplace

  ymarketplace-backend:
    env_file:
      - ./ymarketplace/backend/.env.local
      - path: ./ymarketplace/backend/.env.local-secrets
        required: false
    ports:
      - "8004:8004"  # Django API
      - "9005:9001"  # Prometheus metrics (mapped from internal 9001)
    volumes:
      - ./ymarketplace/backend:/app
      - /app/venv
    depends_on:
      ymarketplace-db:
        condition: service_healthy

  ymarketplace-frontend:
    env_file:
      - ./ymarketplace/frontend/.env.local
      - path: ./ymarketplace/frontend/.env.local-secrets
        required: false
    ports:
      - "3004:3004"
    volumes:
      - ./ymarketplace/frontend:/app
      - /app/node_modules
    depends_on:
      ymarketplace-backend:
        condition: service_started

volumes:
  ymarketplace_postgres_data:

networks:
  ymarketplace:
