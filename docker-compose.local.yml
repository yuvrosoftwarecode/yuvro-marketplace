# ===========================================================================
# docker-compose.local.yml
# Full stack for local development: Postgres, MinIO, Backend, Frontend
# ===========================================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: yuvro-marketplace-db
    command: postgres -p 5436
    ports:
      - "5436:5436"
    environment:
      POSTGRES_DB: yuvro_marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPORT: "5436"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yuvro-marketplace-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yuvro_marketplace_db -p 5436"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: yuvro-marketplace-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9102:9001"   # MinIO console (mapped to 9102)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    networks:
      - yuvro-marketplace-storage
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── MinIO bucket initializer ──────────────────────────────────
  minio-init:
    image: ghcr.io/coollabsio/minio:latest
    container_name: yuvro-marketplace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - yuvro-marketplace-storage
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing minio/yuvro-marketplace-media-local &&
        mc anonymous set download minio/yuvro-marketplace-media-local &&
        mc mb --ignore-existing minio/yuvro-marketplace-media &&
        mc anonymous set download minio/yuvro-marketplace-media &&
        mc mb --ignore-existing minio/ymarketplace &&
        mc anonymous set download minio/ymarketplace &&
        echo '✅ MinIO buckets initialized'
      "

  # ── Django Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: local
    container_name: yuvro-marketplace-backend
    ports:
      - "8004:8004"
    command: >
      sh -c "
        echo '⏳ Waiting for DB...' &&
        python manage.py migrate --noinput &&
        echo '✅ Migrations applied' &&
        python manage.py runserver 0.0.0.0:8004
      "
    env_file:
      - ./backend/.env.local
      - path: ./backend/.env.local-secrets
        required: false
    environment:
      DJANGO_WATCHMAN_TIMEOUT: "30"
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yuvro-marketplace-app
      - yuvro-marketplace-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── TanStack Start Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: local
    container_name: yuvro-marketplace-frontend
    ports:
      - "3004:3004"
    env_file:
      - ./frontend/.env.local
      - path: ./frontend/.env.local-secrets
        required: false
    environment:
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: "3004"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yuvro-marketplace-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  yuvro-marketplace-app:
    external: true
    name: yuvro_marketplace_app
  yuvro-marketplace-storage:
    external: true
    name: yuvro_marketplace_storage
