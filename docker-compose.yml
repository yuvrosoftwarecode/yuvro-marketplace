services:
  ymarketplace-backend:
    build:
      context: ./ymarketplace/backend
      dockerfile: Dockerfile
      target: development
      args:
        - CACHEBUST=${CACHEBUST:-1}
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/health/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ymarketplace
      - yuvro-storage

  ymarketplace-frontend:
    build:
      context: ./ymarketplace/frontend
      dockerfile: Dockerfile
      target: development
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 3004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: on-failure
    networks:
      - ymarketplace
      - yuvro-storage

networks:
  ymarketplace:
    driver: bridge
  yuvro-storage:
    external: true
    name: yuvro_yuvro-storage
