# ── YMarketplace Dev Frontend (marketplace-dev.yuvro.ai → port 3004) ─────────
server {
    listen 80;
    server_name marketplace-dev.yuvro.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name marketplace-dev.yuvro.ai;
    ssl_certificate     /etc/letsencrypt/live/marketplace-dev.yuvro.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace-dev.yuvro.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/marketplace-dev.yuvro.ai/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml font/woff font/woff2;
    client_max_body_size 50M;
    location / {
        proxy_pass http://localhost:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

